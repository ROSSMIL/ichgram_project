<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />

    <meta name="google" content="notranslate" />
    <meta name="google-translate-customization" content="notranslate" />
    <meta name="chrome" content="notranslate" />

    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />

    <link rel="alternate icon" type="image/png" href="/favicon-light.png" />

    <link rel="apple-touch-icon" href="/favicon-light.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>ICHGRAM</title>

    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme");
          var initialTheme = "light";

          if (savedTheme) {
            initialTheme = savedTheme;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            initialTheme = "dark";
          }

          document.documentElement.setAttribute("data-theme", initialTheme);

          var faviconSvg = document.querySelector("link[type='image/svg+xml']");
          var faviconPng = document.querySelector("link[rel='alternate icon']");
          var appleIcon = document.querySelector(
            "link[rel='apple-touch-icon']",
          );

          if (faviconSvg)
            faviconSvg.setAttribute(
              "href",
              "/favicon-" + initialTheme + ".svg",
            );
          if (faviconPng)
            faviconPng.setAttribute(
              "href",
              "/favicon-" + initialTheme + ".png",
            );
          if (appleIcon)
            appleIcon.setAttribute("href", "/favicon-" + initialTheme + ".png");
        } catch (e) {}
      })();
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #fafafa;
        color: #262626;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background-color: #0a0a0a !important;
        color: #f5f5f5;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
